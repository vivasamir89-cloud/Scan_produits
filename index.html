<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Scan Produits</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#1f7a4d;--bd:#e2e0da;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#f1efe9;--mu:#a09e96;--ac:#2f9d68;--bd:#34332f;--er:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 4px}
#net{font-size:13px;color:var(--mu);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;text-align:center;position:relative;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
label.l{font-size:12px;color:var(--mu);display:block;margin:8px 0 3px}
#prev{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:0 auto 10px}
.st{font-size:14px;color:var(--mu);margin-top:8px;text-align:center}
.item{display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:10px 0}
.item:first-child{border-top:0}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.item div{flex:1;min-width:0}.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mu)}
.x{background:none;border:0;color:var(--er);font-size:18px;padding:6px}
</style>
</head>
<body>
<h1>📦 Scan Produits</h1>
<div id="net"></div>

<div class="card">
  <label class="btn">📷 Prendre une photo<input class="fi" id="cam" type="file" accept="image/*" capture="environment"></label>
  <div style="height:8px"></div>
  <label class="btn sec">🖼️ Choisir dans la galerie<input class="fi" id="gal" type="file" accept="image/*"></label>
</div>

<div class="card" id="form" hidden>
  <img id="prev" alt="Photo">
  <label class="l">Nom du produit</label><input type="text" id="fn">
  <label class="l">Code-barres</label><input type="text" id="fc" inputmode="numeric">
  <label class="l">Marque</label><input type="text" id="fm">
  <div class="row"><div><label class="l">Prix</label><input type="text" id="fp" inputmode="decimal"></div><div><label class="l">Quantité</label><input type="text" id="fq" inputmode="numeric" value="1"></div></div>
  <div class="st" id="st"></div>
  <div style="height:8px"></div>
  <div class="row"><button class="btn sec" id="bCancel">Annuler</button><button class="btn" id="bAdd">Ajouter</button></div>
</div>

<div class="card">
  <b id="cnt">Liste (0)</b>
  <div id="list"></div>
  <div style="height:10px"></div>
  <button class="btn" id="bXls" disabled>⬇️ Exporter en Excel</button>
  <button class="btn sec" id="bClr" style="margin-top:8px" disabled>Vider la liste</button>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,photo=null,items=[];

/* --- Stockage local (IndexedDB) --- */
function open(){return new Promise((res,rej)=>{const r=indexedDB.open('scan',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const tx=(mode,fn)=>new Promise((res,rej)=>{const t=db.transaction('p',mode);const r=fn(t.objectStore('p'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)});
async function load(){items=await tx('readonly',s=>s.getAll());render()}

function render(){
  $('cnt').textContent='Liste ('+items.length+')';
  $('list').innerHTML=items.map(it=>{
    const u=it.photo?URL.createObjectURL(it.photo):'';
    return '<div class="item">'+(u?'<img src="'+u+'" alt="">':'')+'<div><b>'+esc(it.nom||'—')+'</b><small>'+esc(it.marque||'—')+' · '+esc(it.code||'—')+' · '+esc(it.prix||'—')+' × '+esc(it.qte||'1')+'</small></div><button class="x" data-id="'+it.id+'">✕</button></div>';
  }).join('')||'<div class="st">Aucun produit pour l’instant.</div>';
  $('bXls').disabled=$('bClr').disabled=!items.length;
}
$('list').onclick=async e=>{const id=e.target.dataset.id;if(id){await tx('readwrite',s=>s.delete(+id));load()}};
$('bClr').onclick=async()=>{if(confirm('Vider toute la liste ?')){await tx('readwrite',s=>s.clear());load()}};

/* --- Photo + code-barres --- */
async function handle(file){
  if(!file)return;
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,900/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*k;c.height=bmp.height*k;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  photo=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  $('prev').src=URL.createObjectURL(photo);
  ['fn','fc','fm','fp'].forEach(i=>$(i).value='');$('fq').value='1';
  let code=null;
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(bmp);if(r.length)code=r[0].rawValue}}catch(e){}
  if(code)$('fc').value=code;
  $('st').textContent=code?'Code-barres lu ✓':'Code-barres non détecté: saisissez-le à la main.';
  $('form').hidden=false;$('fn').focus();
}
$('cam').onchange=e=>{handle(e.target.files[0]);e.target.value=''};
$('gal').onchange=e=>{handle(e.target.files[0]);e.target.value=''};
$('bCancel').onclick=()=>{$('form').hidden=true;photo=null};
$('bAdd').onclick=async()=>{
  await tx('readwrite',s=>s.add({nom:$('fn').value.trim(),code:$('fc').value.trim(),marque:$('fm').value.trim(),prix:$('fp').value.trim(),qte:$('fq').value.trim()||'1',photo}));
  $('form').hidden=true;photo=null;load();
};

/* --- Export Excel (.xlsx) sans bibliothèque --- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=d=>{let c=0xFFFFFFFF;for(const b of d)c=CT[(c^b)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const u16=n=>[n&255,n>>8&255],u32=n=>[n&255,n>>8&255,n>>16&255,n>>>24&255];
function zip(files){
  const en=new TextEncoder(),parts=[],cen=[];let off=0,cl=0;
  for(const f of files){
    const nm=en.encode(f.name),d=en.encode(f.data),crc=crc32(d),sz=d.length;
    parts.push(new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]),nm,d);
    const h=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]);
    cen.push(h,nm);cl+=h.length+nm.length;off+=30+nm.length+sz;
  }
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?null:n};
function xlsx(rows){
  const L='ABCDE';
  const sheet=rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>{
    const ref=L[j]+(i+1);
    if(v===null||v==='')return '';
    return typeof v==='number'?'<c r="'+ref+'"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t>'+x(v)+'</t></is></c>';
  }).join('')+'</row>').join('');
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
    {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
    {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Produits" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},
    {name:'xl/worksheets/sheet1.xml',data:H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="40" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/><col min="3" max="3" width="20" customWidth="1"/><col min="4" max="5" width="10" customWidth="1"/></cols><sheetData>'+sheet+'</sheetData></worksheet>'}
  ]);
}
$('bXls').onclick=()=>{
  const rows=[['Nom du produit','Code Barre','Marque','Prix','Quantité'],...items.map(i=>[i.nom,i.code,i.marque,num(i.prix),num(i.qte)??1])];
  const a=document.createElement('a');a.href=URL.createObjectURL(xlsx(rows));a.download='produits.xlsx';
  document.body.appendChild(a);a.click();a.remove();
};

/* --- Démarrage --- */
function net(){$('net').textContent=navigator.onLine?'🟢 En ligne':'🟠 Hors ligne : tout est enregistré sur ce téléphone'}
addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
open().then(d=>{db=d;load()});
</script>
</body>
</html>
